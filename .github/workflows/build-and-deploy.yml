name: Build and Deploy Bot Jar

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [frontend-updated]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Checkout frontend repo
        uses: actions/checkout@v4
        with:
          repository: Makrivius/Ds-bot-UI
          path: frontend
          token: ${{ secrets.CROSS_REPO_PAT }}   # needed if frontend repo is private

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy frontend build into backend resources
        run: |
          mkdir -p backend/app/src/main/resources/dist
          cp -r frontend/dist/* backend/app/src/main/resources/dist/

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Elevate gradlew jar
        working-directory: backend
        run: chmod +x ./gradlew

      - name: Build shadow jar
        working-directory: backend
        run: ./gradlew shadowJar --no-daemon

      - name: List build output (debug)
        run: find backend/app/build/libs -type f -name "*.jar" -exec ls -la {} \;

      - name: Upload jar via SFTP (raw)
        run: |
          sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.SFTP_PASSWORD }}" sftp -P ${{ secrets.SFTP_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }} <<EOF
          put backend/app/build/libs/app-all.jar /
          bye
          EOF
